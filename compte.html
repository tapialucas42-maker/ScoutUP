<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoutUP — Mon compte</title>
<meta name="theme-color" content="#07090A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#07090A; --card:#111816; --card-2:#0C1211;
    --ink:#EFF3F0; --ink-2:#B4BFB9; --muted:#7C8983;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --green:#00E17A; --green-soft:rgba(0,225,122,.13);
    --warn:#FFC46B; --warn-soft:rgba(255,196,107,.11);
    --red:#FF7B72; --red-soft:rgba(255,123,114,.12);
    --display:'Archivo Black',sans-serif;
    --util:'Barlow Condensed',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--body); background:var(--black); color:var(--ink);
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.55;
    background-image:
      radial-gradient(120% 55% at 50% -8%, rgba(0,225,122,.09), transparent 62%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 84px);
    background-attachment:fixed; min-height:100vh;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  ::placeholder{color:#5F6A65}
  a{color:var(--green)}

  .shell{max-width:760px;margin:0 auto;padding:0 20px 80px}

  .topnav{
    display:flex;align-items:center;gap:14px;padding:18px 0;
    border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap;
  }
  .logo{
    display:flex;align-items:center;font-family:var(--display);font-size:19px;
    letter-spacing:-.03em;text-transform:uppercase;text-decoration:none;color:var(--ink);
  }
  .logo .dot{
    width:28px;height:28px;border-radius:9px;margin-right:10px;
    background:var(--green);color:#04120A;display:grid;place-items:center;
    font-size:15px;box-shadow:0 0 22px rgba(0,225,122,.3);
  }
  .logo .up{color:var(--green)}
  .topnav .right{margin-left:auto;display:flex;align-items:center;gap:10px}

  h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;
     letter-spacing:-.03em;margin:0 0 10px;text-transform:uppercase}
  h2{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:-.02em;
     margin:0 0 6px;text-transform:uppercase}
  h3{font-size:15.5px;margin:0 0 12px;font-weight:700}
  .sub{color:var(--muted);margin:0 0 24px}
  .small{font-size:13px;color:var(--muted)}

  .card{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--line);border-radius:16px;padding:24px;
    box-shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.32);
  }
  .mt{margin-top:16px}

  .label{display:block;font-family:var(--util);text-transform:uppercase;
         letter-spacing:.16em;font-size:12px;font-weight:600;margin:0 0 7px;color:var(--muted)}
  .field{
    width:100%;padding:12px 13px;border:1px solid var(--line-strong);border-radius:11px;
    background:rgba(255,255,255,.04);outline:none;transition:.15s;font-size:16px;
  }
  .field:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .field option{background:#111816;color:var(--ink)}
  .row{display:grid;gap:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:620px){.row2,.row3{grid-template-columns:1fr}}
  .f{margin-bottom:14px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:999px;font-weight:700;font-size:15px;
    background:rgba(255,255,255,.09);color:var(--ink);
    border:1px solid var(--line-strong);transition:.16s;min-height:46px;
  }
  .btn:hover:not(:disabled){background:rgba(255,255,255,.14);transform:translateY(-1px)}
  .btn.accent{background:var(--green);color:#04120A;border-color:transparent;
              box-shadow:0 6px 22px rgba(0,225,122,.22)}
  .btn.accent:hover:not(:disabled){background:#1BE98A}
  .btn.sm{padding:9px 15px;font-size:13.5px;min-height:38px}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  .tabs{display:flex;gap:6px;margin-bottom:22px;background:rgba(255,255,255,.04);
        padding:5px;border-radius:999px;border:1px solid var(--line)}
  .tabs button{flex:1;padding:10px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
  .tabs button.on{background:var(--green);color:#04120A;font-weight:700}

  .roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px}
  @media(max-width:620px){.roles{grid-template-columns:1fr}}
  .roles button{
    padding:14px 10px;border-radius:12px;border:1px solid var(--line-strong);
    background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;transition:.15s;
  }
  .roles button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}

  .banner{
    display:flex;gap:11px;align-items:flex-start;padding:14px 16px;border-radius:12px;
    font-size:13.5px;line-height:1.5;margin-bottom:18px;
    background:var(--green-soft);color:var(--green);border:1px solid rgba(0,225,122,.22);
  }
  .banner.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(255,196,107,.24)}
  .banner.err{background:var(--red-soft);color:var(--red);border-color:rgba(255,123,114,.28)}
  .banner.info{background:rgba(255,255,255,.05);color:var(--ink-2);border-color:var(--line)}

  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:rgba(255,255,255,.04);border:1px solid var(--line);
        border-radius:13px;padding:16px 12px;text-align:center}
  .stat b{display:block;font-family:var(--display);font-weight:400;font-size:23px;
          letter-spacing:-.04em;color:var(--ink)}
  .stat span{font-family:var(--util);text-transform:uppercase;letter-spacing:.14em;
             font-size:11px;color:var(--muted)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
        font-family:var(--util);text-transform:uppercase;letter-spacing:.12em;
        font-size:11.5px;font-weight:600;background:rgba(255,255,255,.07);color:var(--ink-2)}
  .pill.green{background:var(--green-soft);color:var(--green);border:1px solid rgba(0,225,122,.3)}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(255,196,107,.28)}

  .sep{height:1px;background:var(--line);margin:20px 0}

  /* --- navigation par onglets --- */
  .nav{display:flex;gap:4px;flex-wrap:wrap}
  .nav button{
    padding:8px 14px;border-radius:10px;color:var(--muted);
    font-weight:550;font-size:14px;transition:.15s;
  }
  .nav button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .nav button.on{background:var(--green);color:#04120A;font-weight:700}

  .tabbar{display:none}
  @media(max-width:720px){
    .nav{display:none}
    .shell{padding-bottom:110px}
    .tabbar{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
      background:rgba(10,14,13,.94);backdrop-filter:blur(16px);
      border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .tabbar button{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:7px 2px;border-radius:12px;color:var(--muted);
      font-family:var(--util);text-transform:uppercase;letter-spacing:.08em;
      font-size:10px;font-weight:600;line-height:1.1;min-height:52px;justify-content:center;
    }
    .tabbar button .ic{font-size:19px;line-height:1;letter-spacing:0}
    .tabbar button.on{color:var(--green)}
  }

  /* --- vidéos --- */
  .vid{
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:var(--card-2);margin-bottom:14px;
  }
  .vid .thumb{
    aspect-ratio:16/9;position:relative;display:grid;place-items:center;
    background:linear-gradient(135deg,#07090A 0%,#0B1A14 55%,#0F7C4A 190%);
    background-size:cover;background-position:center;cursor:pointer;text-decoration:none;
  }
  .vid .thumb .play{
    width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);
    border:2px solid var(--green);display:grid;place-items:center;
    color:var(--green);font-size:18px;box-shadow:0 0 28px rgba(0,225,122,.3);
  }
  .vid .kind{
    position:absolute;left:10px;top:10px;background:var(--green);color:#04120A;
    font-family:var(--util);text-transform:uppercase;letter-spacing:.12em;
    font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  }
  .vid .body{padding:14px 16px}
  .vid .body h4{margin:0 0 5px;font-size:15px;font-weight:700}
  .vid .foot{
    display:flex;align-items:center;gap:14px;padding:0 16px 14px;
    font-size:13px;color:var(--muted);
  }
  .vid .foot .rm{margin-left:auto;color:var(--red);font-weight:600;font-size:13px}
  .empty{
    text-align:center;padding:44px 20px;color:var(--muted);
    border:1px dashed var(--line-strong);border-radius:14px;
  }
  .center{text-align:center}
  .spin{
    width:18px;height:18px;border:2px solid rgba(255,255,255,.2);
    border-top-color:var(--green);border-radius:50%;
    animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{padding:70px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <div class="topnav">
    <a class="logo" href="index.html"><span class="dot">S</span>Scout<span class="up">UP</span></a>
    <div id="navleft"></div>
    <div class="right" id="navright"></div>
  </div>
  <div id="app"><div class="loading"><span class="spin"></span><br><br>Chargement…</div></div>
</div>
<div id="tabbar"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ====================================================================
   CONNEXION À LA BASE
   La clé "publishable" est faite pour être visible dans le navigateur.
   Ce qui protège les données, ce sont les règles RLS posées côté base,
   pas le secret de cette clé.
   ==================================================================== */
const SUPABASE_URL = 'https://zzpmxzvqjzjpdlobqqii.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2XI4Ez9EjpeVtpsBTctmhg_6V1mcQMs';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ====================================================================
   ÉTAT
   ==================================================================== */
const POSTES = ["Gardien","Latéral droit","Latéral gauche","Défenseur central",
  "Milieu défensif","Milieu central","Milieu offensif","Ailier droit",
  "Ailier gauche","Attaquant"];
const NIVEAUX = ["National 2","National 3","Régional 1","Régional 2","Régional 3",
  "Départemental","U19 Nationaux","Universitaire"];
const DISPOS = ["Libre","Sous contrat","Fin de contrat"];

let S = {
  view: 'loading',      // loading | auth | profil | app
  tab: 'accueil',       // accueil | videos | publier | messages
  posts: [],            // vidéos du joueur, chargées depuis la base
  agent: null,          // ligne agents (si le compte est un agent)
  results: [],          // résultats de recherche côté agent
  openPlayer: null,     // fiche joueur ouverte
  openPosts: [],        // vidéos de la fiche ouverte
  shortlist: [],        // ids des joueurs mis de côté
  filters: { q:'', poste:'', niveau:'', pays:'', dispo:'', ageMax:'' },
  pending: [],          // agents/clubs en attente de vérification (admin)
  authTab: 'signup',    // signup | login
  role: 'player',
  session: null,
  profile: null,        // ligne profiles
  player: null,         // ligne players
  msg: null,            // {type, text}
  busy: false,
  form: {}
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function say(type, text){ S.msg = {type, text}; render(); }
function clearMsg(){ S.msg = null; }

/* Traduction des messages d'erreur Supabase en français lisible */
function humanError(e){
  const m = (e?.message || String(e)).toLowerCase();
  if (m.includes('invalid login credentials')) return "Email ou mot de passe incorrect.";
  if (m.includes('user already registered')) return "Un compte existe déjà avec cet email.";
  if (m.includes('password should be at least')) return "Le mot de passe doit faire au moins 6 caractères.";
  if (m.includes('unable to validate email')) return "Cette adresse email n'est pas valide.";
  if (m.includes('email not confirmed')) return "Confirmez votre email avant de vous connecter.";
  if (m.includes('rate limit') || m.includes('too many')) return "Trop de tentatives. Réessayez dans quelques minutes.";
  if (m.includes('failed to fetch') || m.includes('networkerror')) return "Connexion au serveur impossible. Vérifiez votre réseau.";
  return e?.message || "Une erreur est survenue.";
}

/* ------------------------------------------------------------------
   LIENS VIDÉO
   On ne stocke pas les fichiers : le joueur colle un lien YouTube,
   Instagram, TikTok ou Veo. On en tire juste de quoi afficher une
   vignette quand c'est possible.
   ------------------------------------------------------------------ */
function videoInfo(url){
  const u = (url||'').trim();
  let m;
  if ((m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/)))
    return { source:'YouTube', thumb:`https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` };
  if (/instagram\.com/.test(u))  return { source:'Instagram', thumb:null };
  if (/tiktok\.com/.test(u))     return { source:'TikTok',    thumb:null };
  if (/veo\.co|app\.veo\.co/.test(u)) return { source:'Veo', thumb:null };
  if (/vimeo\.com/.test(u))      return { source:'Vimeo',     thumb:null };
  if (/^https?:\/\//.test(u))    return { source:'Lien',      thumb:null };
  return null;
}

const age = d => {
  if(!d) return null;
  const b = new Date(d), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
};

/* ====================================================================
   CHARGEMENT DE LA SESSION
   ==================================================================== */
async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  S.session = session;

  if (!session){ S.view = 'auth'; return render(); }
  await loadMe();
  render();
}

async function loadMe(){
  const uid = S.session.user.id;

  const { data: prof } = await db.from('profiles').select('*').eq('id', uid).maybeSingle();
  S.profile = prof;

  if (!prof){
    // Le trigger n'a pas encore créé la ligne : on la crée nous-mêmes.
    const meta = S.session.user.user_metadata || {};
    const { data: created, error } = await db.from('profiles').insert({
      id: uid,
      role: meta.role || 'player',
      full_name: meta.full_name || ''
    }).select().maybeSingle();
    if (error) { S.view='auth'; return say('err', humanError(error)); }
    S.profile = created;
  }

  // Un administrateur peut être joueur, agent ou club : on charge les
  // demandes en attente dans tous les cas.
  if (S.profile.is_admin) await loadPending();

  if (S.profile.role === 'player'){
    const { data: pl } = await db.from('players').select('*').eq('id', uid).maybeSingle();
    S.player = pl;
    S.view = pl ? 'app' : 'profil';
    if (pl){ S.form = {...pl}; await loadPosts(); }
  } else if (S.profile.role === 'agent'){
    const { data: ag } = await db.from('agents').select('*').eq('id', uid).maybeSingle();
    S.agent = ag;
    S.view = 'app';
    S.tab = ag ? (ag.verified ? 'recherche' : 'attente') : 'licence';
    if (ag && ag.verified) await chercher();
  } else {
    // Clubs : espace dédié à venir
    S.view = 'app';
    S.tab = 'attente';
  }
}

/* ------------------------------------------------------------------
   RECHERCHE DE JOUEURS (agents vérifiés)
   ------------------------------------------------------------------ */
async function chercher(){
  const f = S.filters;
  let q = db.from('players').select('*').eq('visible', true);

  if (f.poste)  q = q.eq('poste', f.poste);
  if (f.niveau) q = q.eq('niveau', f.niveau);
  if (f.dispo)  q = q.eq('dispo', f.dispo);
  if (f.pays)   q = q.ilike('pays', `%${f.pays}%`);
  if (f.ageMax){
    // Un âge maximum se traduit par une date de naissance minimale.
    const d = new Date();
    d.setFullYear(d.getFullYear() - parseInt(f.ageMax, 10) - 1);
    q = q.gte('birth_date', d.toISOString().slice(0,10));
  }

  const { data: players, error } = await q.limit(60);
  if (error){ say('err', humanError(error)); return; }

  // Les noms vivent dans "profiles" : on les récupère en une requête.
  const ids = (players||[]).map(p=>p.id);
  let noms = {};
  if (ids.length){
    const { data: profs } = await db.from('profiles').select('id, full_name').in('id', ids);
    (profs||[]).forEach(pr => noms[pr.id] = pr.full_name);
  }

  let res = (players||[]).map(p => ({...p, full_name: noms[p.id] || 'Joueur'}));

  // Le texte libre filtre côté navigateur : peu de résultats, pas besoin
  // de compliquer la requête.
  if (f.q){
    const t = f.q.toLowerCase();
    res = res.filter(p =>
      (p.full_name||'').toLowerCase().includes(t) ||
      (p.club_actuel||'').toLowerCase().includes(t) ||
      (p.ville||'').toLowerCase().includes(t));
  }
  S.results = res;
}

async function ouvrirJoueur(id){
  const p = S.results.find(x => x.id === id);
  if (!p) return;
  S.openPlayer = p;
  S.openPosts = [];
  render();

  // La visite est enregistrée côté base : c'est ce que le joueur verra.
  await db.rpc('enregistrer_visite', { p_player: id });

  const { data } = await db.from('posts').select('*')
    .eq('player_id', id).order('created_at', { ascending:false });
  S.openPosts = data || [];
  render();
}

async function toggleShort(id){
  const i = S.shortlist.indexOf(id);
  if (i > -1){
    S.shortlist.splice(i,1);
    await db.from('shortlist').delete().eq('agent_id', S.session.user.id).eq('player_id', id);
  } else {
    S.shortlist.push(id);
    await db.from('shortlist').insert({ agent_id:S.session.user.id, player_id:id });
  }
  render();
}

/* ------------------------------------------------------------------
   FICHE AGENT + ADMINISTRATION
   ------------------------------------------------------------------ */
async function creerAgent(){
  const f = S.form;
  if (!f.licence_fifa) return say('err', "Votre numéro de licence FIFA est obligatoire.");

  S.busy = true; clearMsg(); render();
  const { data, error } = await db.from('agents').insert({
    id: S.session.user.id,
    licence_fifa: f.licence_fifa.trim(),
    cabinet: f.cabinet ? f.cabinet.trim() : null,
    pays: f.pays ? f.pays.trim() : null,
    verified: false
  }).select().maybeSingle();
  S.busy = false;

  if (error) return say('err', humanError(error));
  S.agent = data;
  S.tab = 'attente';
  say('ok', "Demande envoyée. On vérifie votre licence et on revient vers vous.");
}

async function loadPending(){
  const { data: ags } = await db.from('agents').select('*').eq('verified', false);
  const ids = (ags||[]).map(a=>a.id);
  let noms = {};
  if (ids.length){
    const { data: profs } = await db.from('profiles').select('id, full_name').in('id', ids);
    (profs||[]).forEach(pr => noms[pr.id] = pr.full_name);
  }
  S.pending = (ags||[]).map(a => ({...a, full_name: noms[a.id] || '—'}));
}

async function verifierAgent(id){
  const { error } = await db.from('agents').update({ verified:true }).eq('id', id);
  if (error) return say('err', humanError(error));
  await loadPending();
  say('ok', "Agent vérifié.");
}

async function loadPosts(){
  const { data, error } = await db.from('posts')
    .select('*').eq('player_id', S.session.user.id)
    .order('created_at', { ascending:false });
  if (!error) S.posts = data || [];
}

/* ====================================================================
   ACTIONS
   ==================================================================== */
async function signup(){
  const f = S.form;
  if (!f.email || !f.password) return say('err', "Email et mot de passe sont obligatoires.");
  if (!f.full_name) return say('err', "Indiquez votre nom et prénom.");
  if (f.password.length < 6) return say('err', "Le mot de passe doit faire au moins 6 caractères.");

  S.busy = true; clearMsg(); render();
  const { data, error } = await db.auth.signUp({
    email: f.email.trim(),
    password: f.password,
    options: { data: { role: S.role, full_name: f.full_name.trim() } }
  });
  S.busy = false;

  if (error) return say('err', humanError(error));

  if (!data.session){
    // Confirmation par email activée côté Supabase
    S.view = 'auth';
    return say('info', "Compte créé. Ouvrez l'email de confirmation qu'on vient de vous envoyer, puis connectez-vous.");
  }
  S.session = data.session;
  S.form = {};
  await loadMe();
  render();
}

async function login(){
  const f = S.form;
  if (!f.email || !f.password) return say('err', "Email et mot de passe sont obligatoires.");

  S.busy = true; clearMsg(); render();
  const { data, error } = await db.auth.signInWithPassword({
    email: f.email.trim(), password: f.password
  });
  S.busy = false;

  if (error) return say('err', humanError(error));
  S.session = data.session;
  S.form = {};
  await loadMe();
  render();
}

async function logout(){
  await db.auth.signOut();
  S = {...S, view:'auth', authTab:'login', session:null, profile:null, player:null, form:{}, msg:null};
  render();
}

async function saveProfil(){
  const f = S.form;
  const manquants = [];
  if (!f.birth_date) manquants.push("date de naissance");
  if (!f.poste)      manquants.push("poste");
  if (!f.pays)       manquants.push("pays");
  if (manquants.length) return say('err', "Il manque : " + manquants.join(", ") + ".");

  const a = age(f.birth_date);
  if (a === null || a < 10 || a > 60) return say('err', "Vérifiez la date de naissance.");

  S.busy = true; clearMsg(); render();

  const payload = {
    id: S.session.user.id,
    birth_date: f.birth_date,
    poste: f.poste,
    pied: f.pied || null,
    taille_cm: f.taille_cm ? parseInt(f.taille_cm, 10) : null,
    club_actuel: f.club_actuel || null,
    niveau: f.niveau || null,
    pays: f.pays,
    ville: f.ville || null,
    dispo: f.dispo || null,
    bio: f.bio || null,
    matchs: parseInt(f.matchs || 0, 10),
    buts: parseInt(f.buts || 0, 10),
    passes: parseInt(f.passes || 0, 10),
    clean_sheets: parseInt(f.clean_sheets || 0, 10),
    updated_at: new Date().toISOString()
  };

  const { data, error } = await db.from('players').upsert(payload).select().maybeSingle();
  S.busy = false;

  if (error) return say('err', humanError(error));
  S.player = data;
  S.view = 'app';
  S.tab = 'accueil';
  await loadPosts();
  say('ok', "Profil enregistré.");
}

async function publier(){
  const f = S.form;
  if (!f.video_url) return say('err', "Collez le lien de votre vidéo.");
  const info = videoInfo(f.video_url);
  if (!info) return say('err', "Ce lien n'est pas valide. Il doit commencer par https://");
  if (!f.titre) return say('err', "Donnez un titre à votre vidéo.");

  S.busy = true; clearMsg(); render();
  const { error } = await db.from('posts').insert({
    player_id: S.session.user.id,
    titre: f.titre.trim(),
    description: f.description ? f.description.trim() : null,
    video_url: f.video_url.trim(),
    kind: f.kind || 'Compilation'
  });
  S.busy = false;

  if (error) return say('err', humanError(error));
  S.form = {...S.player};      // on remet le formulaire de profil
  await loadPosts();
  S.tab = 'videos';
  say('ok', "Vidéo publiée.");
}

async function supprimerPost(id){
  if (!confirm("Supprimer cette vidéo ?")) return;
  const { error } = await db.from('posts').delete().eq('id', id);
  if (error) return say('err', humanError(error));
  await loadPosts();
  say('ok', "Vidéo supprimée.");
}

function champ(label, key, opts={}){
  const v = esc(S.form[key] ?? '');
  if (opts.options){
    return `<div class="f"><label class="label">${label}</label>
      <select class="field" data-f="${key}">
        <option value="">${opts.placeholder || '—'}</option>
        ${opts.options.map(o=>`<option ${S.form[key]===o?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
  }
  if (opts.textarea){
    return `<div class="f"><label class="label">${label}</label>
      <textarea class="field" rows="3" data-f="${key}" placeholder="${opts.placeholder||''}">${v}</textarea></div>`;
  }
  return `<div class="f"><label class="label">${label}</label>
    <input class="field" type="${opts.type||'text'}" data-f="${key}" value="${v}"
           placeholder="${opts.placeholder||''}"></div>`;
}

function vApp(){
  if (S.profile.role === 'agent'){
    if (S.tab === 'admin')     return vAdmin();
    if (S.tab === 'licence')   return vLicence();
    if (S.tab === 'attente')   return vAttente();
    if (S.openPlayer)          return vFiche();
    if (S.tab === 'shortlist') return vRecherche(true);
    return vRecherche(false);
  }
  if (S.profile.role === 'club'){
    if (S.tab === 'admin') return vAdmin();
    return `
      <h1>Espace club</h1>
      <p class="sub">Votre compte club est créé.</p>
      ${msgHtml()}
      <div class="card"><div class="banner info">🚧<div>
        L'espace club — annonces de recrutement et candidatures — arrive juste après.
      </div></div>
      <a class="btn mt" href="app.html">Voir la démo →</a></div>`;
  }
  if (S.tab === 'admin' && S.profile.is_admin) return vAdmin();
  if (S.tab === 'videos')   return vVideos();
  if (S.tab === 'publier')  return vPublier();
  if (S.tab === 'messages') return vMessages();
  return vAccueil();
}

  return `
    <h1>${shortOnly ? 'Ma shortlist' : 'Rechercher'}</h1>
    <p class="sub">${shortOnly
      ? `${liste.length} joueur${liste.length>1?'s':''} mis de côté.`

        const info = videoInfo(post.video_url) || {source:'Lien', thumb:null};
        const d = new Date(post.created_at).toLocaleDateString('fr-FR',
          {day:'numeric', month:'long', year:'numeric'});
        return `<div class="vid">
          <a class="thumb" href="${esc(post.video_url)}" target="_blank" rel="noopener"
             ${info.thumb ? `style="background-image:linear-gradient(rgba(7,9,10,.35),rgba(7,9,10,.55)),url('${esc(info.thumb)}')"` : ''}>
            <span class="kind">${esc(post.kind||'Vidéo')}</span>
            <span class="play">▶</span>
          </a>
          <div class="body">
            <h4>${esc(post.titre)}</h4>
            ${post.description ? `<p class="small" style="margin:0">${esc(post.description)}</p>` : ''}
          </div>
          <div class="foot">
            <span>${esc(info.source)}</span>
            <span>${d}</span>
            <button class="rm" data-a="rmpost" data-v="${post.id}">Supprimer</button>
          </div>
        </div>`;
      }).join('')}`}`;
}

function vPublier(){
  const info = videoInfo(S.form.video_url || '');
  return `
    <h1>Publier une vidéo</h1>
    <p class="sub">Collez le lien, on s'occupe du reste.</p>

    ${msgHtml()}

    <div class="card">
      <div class="banner info">🔗<div>
        Hébergez votre vidéo où vous voulez — YouTube, Instagram, TikTok, Veo —
        et collez le lien ici. Rien à téléverser.
      </div></div>

      <div class="f">
        <label class="label">Lien de la vidéo</label>
        <input class="field" data-f="video_url" value="${esc(S.form.video_url||'')}"
               placeholder="https://youtube.com/watch?v=...">
        <p class="small" id="vidhint" style="margin:8px 0 0;color:var(--green)">${
          info ? '✓ ' + esc(info.source) + ' reconnu' : ''}</p>
      </div>

      ${champ("Titre","titre",{placeholder:"Compil saison 2025-2026"})}
      ${champ("Type","kind",{options:["Compilation","Action de match","Match entier","Entraînement"]})}
      ${champ("Description","description",{textarea:true,
        placeholder:"Ce qu'on y voit, dans quel contexte."})}

      <button class="btn accent wide mt" data-a="publier" ${S.busy?'disabled':''}>
        ${S.busy ? '<span class="spin"></span> Publication…' : "Publier"}
      </button>
    </div>

    <button class="btn wide mt" data-a="tab" data-v="videos">Annuler</button>`;
}

function vMessages(){
  return `
    <h1>Messages</h1>
    <p class="sub">Vos échanges avec les agents et les clubs.</p>
    ${msgHtml()}
    <div class="empty">
      <p style="margin:0 0 8px">🚧 La messagerie arrive bientôt.</p>
      <p class="small" style="margin:0">
        Quand un agent vérifié ouvrira votre profil et voudra vous contacter,
        la conversation apparaîtra ici.
      </p>
    </div>`;
}

/* Les onglets dépendent du rôle et, pour un agent, de sa vérification. */
function tabItems(){
  if (S.view !== 'app') return [];
  const admin = S.profile.is_admin ? [['admin','⚙','Vérifications']] : [];

  if (S.profile.role === 'player') return [
    ['accueil','⌂','Accueil'],
    ['videos','▶','Mes vidéos','Vidéos'],
    ['publier','＋','Publier'],
    ['messages','✉','Messages'],
    ...admin
  ];
  if (S.profile.role === 'agent'){
    if (!S.agent || !S.agent.verified) return admin;
    return [
      ['recherche','⌕','Recherche'],
      ['shortlist','★','Shortlist'],
      ['messages','✉','Messages'],
      ...admin
    ];
  }
  return admin;
}

function navHtml(){
  const items = tabItems();
  if (!items.length) return '';
  return `<div class="nav">${items.map(([k,,l])=>
    `<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</div>`;
}

function tabbarHtml(){
  const items = tabItems();
  if (items.length < 2) return '';
  return `<div class="tabbar">${items.map(([k,ic,l,court])=>
    `<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}">
       <span class="ic">${ic}</span><span>${court||l}</span>
     </button>`).join('')}</div>`;
}

/* ====================================================================
   RENDU
   ==================================================================== */
function render(){
  $('#navleft').innerHTML  = S.session ? navHtml() : '';
  $('#navright').innerHTML = S.session
    ? `<span class="small" style="margin-right:6px">${esc(S.session.user.email)}</span>
       <button class="btn sm" data-a="logout">Déconnexion</button>`
    : `<a class="btn sm" href="app.html">Voir la démo</a>`;

  let html = '';
  if (S.view === 'loading')     html = `<div class="loading"><span class="spin"></span><br><br>Chargement…</div>`;
  else if (S.view === 'auth')   html = vAuth();
  else if (S.view === 'profil') html = vProfil();
  else if (S.view === 'app')    html = vApp();
  $('#app').innerHTML = html;
  $('#tabbar').innerHTML = S.session ? tabbarHtml() : '';
}

/* ====================================================================
   ÉVÉNEMENTS
   ==================================================================== */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-f]');
  if (!el) return;
  S.form[el.dataset.f] = el.value;
  // Le champ "clean sheets" apparaît/disparaît selon le poste choisi.
  if (el.dataset.f === 'poste') return render();
  // Retour immédiat sur le lien vidéo, sans re-rendre (le curseur resterait perdu).
  if (el.dataset.f === 'video_url'){
    const h = $('#vidhint');
    if (h){ const i = videoInfo(el.value); h.textContent = i ? '✓ ' + i.source + ' reconnu' : ''; }
  }
});

let fltTimer = null;
function onFilter(el){
  S.filters[el.dataset.flt] = el.value;
  clearTimeout(fltTimer);
  // On attend une pause dans la frappe avant d'interroger la base.
  fltTimer = setTimeout(() => chercher().then(render), 300);
}
document.addEventListener('input',  e => { const el=e.target.closest('[data-flt]'); if (el) onFilter(el); });
document.addEventListener('change', e => { const el=e.target.closest('[data-flt]'); if (el) onFilter(el); });

document.addEventListener('change', e => {
  const el = e.target.closest('[data-f]');
  if (!el) return;
  S.form[el.dataset.f] = el.value;
  if (el.dataset.f === 'poste' || el.dataset.f === 'birth_date') render();
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;

  if (a === 'authtab'){ S.authTab = v; clearMsg(); return render(); }
  if (a === 'role')   { S.role = v; return render(); }
  if (a === 'signup') return signup();
  if (a === 'login')  return login();
  if (a === 'logout') return logout();
  if (a === 'save')   return saveProfil();
  if (a === 'edit')   { S.form = {...S.player}; S.view = 'profil'; clearMsg(); return render(); }
  if (a === 'tab')    {
    S.tab = v; clearMsg(); S.openPlayer = null; S.openPosts = [];
    if (v === 'admin'){ render(); return loadPending().then(render); }
    // Le formulaire de publication démarre vide, pas rempli avec le profil
    if (v === 'publier') S.form = {kind:'Compilation'};
    window.scrollTo({top:0});
    return render();
  }
  if (a === 'publier') return publier();
  if (a === 'rmpost')  return supprimerPost(v);
  if (a === 'creeragent') return creerAgent();
  if (a === 'openp')   return ouvrirJoueur(v);
  if (a === 'closep')  { S.openPlayer = null; S.openPosts = []; return render(); }
  if (a === 'short')   { e.stopPropagation(); return toggleShort(v); }
  if (a === 'verif')   return verifierAgent(v);
  if (a === 'resetflt'){
    S.filters = { q:'', poste:'', niveau:'', pays:'', dispo:'', ageMax:'' };
    render(); return chercher().then(render);
  }
});

// Entrée = valider le formulaire en cours
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || S.busy) return;
  if (e.target.tagName === 'TEXTAREA') return;
  if (S.view === 'auth') { e.preventDefault(); S.authTab === 'signup' ? signup() : login(); }
});

boot().catch(err => {
  S.view = 'auth';
  say('err', humanError(err));
});
</script>
</body>
</html>
