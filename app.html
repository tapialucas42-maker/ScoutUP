<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScoutUP — Démo produit</title>
<meta name="description" content="ScoutUP : la plateforme qui connecte les joueurs non professionnels d'Europe aux agents licenciés FIFA et aux clubs recruteurs. Démo cliquable.">
<meta name="theme-color" content="#0A0B0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="ScoutUP — Démo produit">
<meta property="og:description" content="Profil joueur, publication de vidéos, recherche agents, annonces clubs. Démo cliquable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Identité ScoutUp — noir & vert, alignée sur la landing page */
  --black:#07090A;
  --black-2:#0D1211;
  --ink:#EFF3F0;
  --ink-2:#B4BFB9;
  --muted:#7C8983;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --bg:#07090A;
  --card:#111816;
  --card-2:#0C1211;
  --green:#00E17A;
  --green-dark:#00C46A;
  --green-deep:#00E17A;
  --green-soft:rgba(0,225,122,.13);
  --warn:#FFC46B;
  --warn-soft:rgba(255,196,107,.11);
  --radius:16px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.32);
  --display:'Archivo Black',system-ui,sans-serif;
  --util:'Barlow Condensed',system-ui,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.55;
  /* lignes de terrain en filigrane, comme sur la landing */
  background-image:
    radial-gradient(120% 55% at 50% -8%, rgba(0,225,122,.09), transparent 62%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 84px);
  background-attachment:fixed;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::placeholder{color:#5F6A65}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--green);outline-offset:2px
}

/* ---------- barre prototype ---------- */
html.public .proto-bar{display:none}
.proto-bar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:9px 18px;background:#000;color:#fff;font-size:12.5px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.proto-bar strong{font-family:var(--display);font-size:14px;letter-spacing:-.02em;text-transform:uppercase;font-weight:400}
.proto-bar strong em{color:var(--green);font-style:normal}
.proto-tag{
  font-family:var(--util);text-transform:uppercase;letter-spacing:.16em;
  background:rgba(255,255,255,.1);padding:3px 10px;border-radius:999px;font-size:11px
}
.proto-jump{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proto-jump select{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 9px;font-size:12px}
.proto-jump select option{color:#111}
.proto-reset{border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:5px 11px;font-size:12px}
.proto-reset:hover{background:rgba(255,255,255,.12)}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 20px 90px;position:relative}
.topnav{
  display:flex;align-items:center;gap:16px;padding:16px 0;
  border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap;
}
.logo{
  display:flex;align-items:center;gap:0;cursor:pointer;
  font-family:var(--display);font-size:19px;letter-spacing:-.03em;
  text-transform:uppercase;font-weight:400;
}
.logo .dot{
  width:28px;height:28px;border-radius:9px;margin-right:10px;
  background:var(--green);color:#04120A;
  display:grid;place-items:center;font-size:15px;
  box-shadow:0 0 22px rgba(0,225,122,.3);
}
.logo .up{color:var(--green)}
.topnav nav{display:flex;gap:4px;margin-left:10px;flex-wrap:wrap}
.topnav nav button{
  padding:8px 13px;border-radius:10px;color:var(--muted);
  font-weight:550;font-size:14px;transition:.15s;
}
.topnav nav button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.topnav nav button.on{background:var(--green);color:#04120A;font-weight:700}
.topnav .right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ---------- atomes ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;
  background:rgba(255,255,255,.09);color:var(--ink);
  border:1px solid var(--line-strong);transition:.16s;
}
.btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.btn.accent{background:var(--green);color:#04120A;border-color:transparent;box-shadow:0 6px 22px rgba(0,225,122,.22)}
.btn.accent:hover{background:#1BE98A;box-shadow:0 10px 30px rgba(0,225,122,.32)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:rgba(255,255,255,.07);border-color:var(--green)}
.btn.sm{padding:9px 15px;font-size:13.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn[disabled]:hover{transform:none}

.card{
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
}
.pad{padding:22px}
.grid{display:grid;gap:16px}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
  font-family:var(--util);text-transform:uppercase;letter-spacing:.12em;
  font-size:11.5px;font-weight:600;
  background:rgba(255,255,255,.07);color:var(--ink-2);
}
.pill.green{background:var(--green-soft);color:var(--green);border:1px solid rgba(0,225,122,.3)}
.pill.black{background:var(--green);color:#04120A}
.pill.warn{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(255,196,107,.28)}

.avatar{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#04120A;flex:none;
}
.avatar.sm{width:34px;height:34px;border-radius:10px;font-size:12px}
.avatar.lg{width:78px;height:78px;border-radius:20px;font-size:26px}

h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.04;letter-spacing:-.025em;margin:0 0 10px;text-transform:uppercase}
h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;letter-spacing:-.02em;margin:0 0 4px;text-transform:uppercase}
h3{font-size:15.5px;margin:0 0 11px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.small{font-size:13px;color:var(--muted)}
.label{
  display:block;font-family:var(--util);text-transform:uppercase;letter-spacing:.16em;
  font-size:12px;font-weight:600;margin:0 0 7px;color:var(--muted);
}
.field{
  width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;
  background:rgba(255,255,255,.04);outline:none;transition:.15s;
}
.field:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);background:rgba(255,255,255,.06)}
.field option{background:#111816;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mt{margin-top:16px}.mt-s{margin-top:9px}.mt-l{margin-top:28px}
.sep{height:1px;background:var(--line);margin:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line-strong);
  background:transparent;font-size:13px;font-weight:550;color:var(--ink-2);transition:.15s;
}
.chip:hover{border-color:var(--green);color:var(--ink)}
.chip.on{background:var(--green);color:#04120A;border-color:var(--green);font-weight:700}
.chip.rm{background:rgba(255,255,255,.1);color:var(--ink);border-color:var(--line-strong)}

/* ---------- accueil ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0B1210,#07090A);
  border:1px solid var(--line);
  color:#fff;border-radius:24px;padding:64px 40px;text-align:center;margin-top:10px;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(80% 60% at 50% 0%, rgba(0,225,122,.16), transparent 62%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 1px, transparent 1px 74px);
}
.hero > *{position:relative}
.hero h1{font-size:52px;max-width:760px;margin:0 auto 18px;letter-spacing:-.03em;line-height:.98}
.hero h1 em{color:var(--green);font-style:normal}
.hero .sub{color:rgba(239,243,240,.62);max-width:560px;margin:0 auto;font-size:17px}
.hero .stats{display:flex;gap:44px;justify-content:center;margin-top:38px;flex-wrap:wrap}
.hero .stats b{display:block;font-family:var(--display);font-weight:400;font-size:27px;color:var(--green);letter-spacing:-.03em}
.hero .stats span{font-family:var(--util);text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;color:rgba(239,243,240,.5)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.role{padding:26px;text-align:left;cursor:pointer;transition:.18s}
.role:hover{transform:translateY(-3px);border-color:rgba(0,225,122,.5);box-shadow:0 18px 44px rgba(0,0,0,.45)}
.role .ico{font-size:25px}

/* ---------- étapes ---------- */
.steps{display:flex;gap:8px;margin-bottom:24px}
.steps div{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.11)}
.steps div.on{background:var(--green);box-shadow:0 0 14px rgba(0,225,122,.45)}

/* ---------- recherche ---------- */
.search{display:grid;grid-template-columns:268px 1fr;gap:22px;align-items:start}
.filters{position:sticky;top:58px;max-height:calc(100vh - 84px);overflow:auto}
.plist{display:grid;gap:12px}
.pcard{display:flex;gap:14px;align-items:center;padding:16px;cursor:pointer;transition:.15s}
.pcard:hover{border-color:rgba(0,225,122,.45);transform:translateY(-2px)}
.pcard .meta{flex:1;min-width:0}
.pcard .nm{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score{text-align:center;flex:none;padding-left:15px;border-left:1px solid var(--line)}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:-.04em;color:var(--green)}
.score span{font-family:var(--util);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em}

.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:13px;padding:16px 12px;text-align:center;
}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:-.04em;color:var(--ink)}
.stat span{font-family:var(--util);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--muted)}

/* ---------- publications ---------- */
.feed{max-width:620px;margin:0 auto}
.post{margin-bottom:18px;overflow:hidden}
.post .head{display:flex;gap:11px;align-items:center;padding:15px 16px}
.thumb{
  aspect-ratio:16/9;background:linear-gradient(135deg,#07090A 0%,#0F2A1E 60%,#068F4E 100%);
  display:grid;place-items:center;position:relative;cursor:pointer;overflow:hidden;
}
.thumb::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px);}
.thumb .play{
  width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.35);
  border:2px solid var(--green);backdrop-filter:blur(4px);
  display:grid;place-items:center;color:var(--green);font-size:19px;
  box-shadow:0 0 30px rgba(0,225,122,.28);
}
.thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.thumb .kind{
  position:absolute;left:10px;top:10px;background:var(--green);color:#04120A;
  font-family:var(--util);text-transform:uppercase;letter-spacing:.12em;
  font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;
}
.post .body{padding:15px 16px}
.actions{display:flex;gap:18px;align-items:center;padding:0 16px 15px;font-size:13.5px;color:var(--muted)}
.actions button{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);font-weight:600;transition:.15s}
.actions button:hover{color:var(--ink)}
.actions button.liked{color:var(--green)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gal .thumb{border-radius:12px}
.gal .thumb .play{width:38px;height:38px;font-size:14px;border-width:1.5px}

/* ---------- annonces ---------- */
.ann{padding:21px}
.ann .top{display:flex;gap:13px;align-items:flex-start}
.ann .top .meta{flex:1;min-width:0}

/* ---------- messages ---------- */
.msgwrap{display:grid;grid-template-columns:290px 1fr;overflow:hidden}
.threads{border-right:1px solid var(--line);max-height:520px;overflow:auto}
.thread{padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;transition:.14s}
.thread:hover{background:rgba(255,255,255,.045)}
.thread.on{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green)}
.bubbles{padding:20px;display:flex;flex-direction:column;gap:10px;min-height:300px;max-height:430px;overflow:auto}
.bub{max-width:74%;padding:11px 15px;border-radius:16px;background:rgba(255,255,255,.07);font-size:14px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--green);color:#04120A;font-weight:500}
.composer{border-top:1px solid var(--line);padding:13px;display:flex;gap:10px}

/* ---------- tarifs ---------- */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.plan{padding:28px;display:flex;flex-direction:column}
.plan.feat{
  border-color:rgba(0,225,122,.42);
  background:linear-gradient(180deg,rgba(0,225,122,.07),var(--card-2));
  box-shadow:0 0 0 1px rgba(0,225,122,.07) inset, var(--shadow);
}
.plan.feat .sub,.plan.feat li{color:var(--ink-2)}
.plan .price{font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:-.05em;margin:16px 0 2px;color:var(--green)}
.plan .price span{font-family:var(--body);font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.plan.feat .price span{color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:20px 0;display:grid;gap:10px;font-size:14px;flex:1;color:var(--ink-2)}
.plan li::before{content:"✓";color:var(--green);font-weight:800;margin-right:9px}

/* ---------- divers ---------- */
.banner{
  display:flex;gap:12px;align-items:flex-start;padding:15px 17px;border-radius:13px;
  background:var(--green-soft);color:var(--green);font-size:13.5px;
  border:1px solid rgba(0,225,122,.22);
}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(255,196,107,.24)}
.banner.dark{background:rgba(255,255,255,.05);color:var(--ink-2);border-color:var(--line)}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.bar{height:7px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;box-shadow:0 0 14px rgba(0,225,122,.5)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
  background:var(--green);color:#04120A;padding:13px 22px;border-radius:999px;
  font-size:14px;font-weight:600;box-shadow:0 12px 34px rgba(0,225,122,.28);
}
.note{font-size:12.5px;color:var(--muted);font-style:italic}

.head-cta{margin-left:auto}

/* ---------- bandeau démo ---------- */
.demobar{
  position:fixed;left:0;right:0;bottom:0;z-index:65;
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:rgba(10,14,13,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  font-family:var(--util);text-transform:uppercase;letter-spacing:.14em;
  font-size:12px;color:var(--muted);
}
.demobar .btn{letter-spacing:0;text-transform:none;font-family:var(--body)}

/* ---------- barre d'onglets mobile ---------- */
.tabbar{display:none}
@media(max-width:760px){
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:rgba(10,14,13,.93);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 2px;border-radius:12px;color:var(--muted);
    font-family:var(--util);text-transform:uppercase;letter-spacing:.08em;
    font-size:10px;font-weight:600;line-height:1.1;
    min-height:52px;justify-content:center;position:relative;transition:.15s;
  }
  .tabbar button .ic{font-size:19px;line-height:1;letter-spacing:0}
  .tabbar button.on{color:var(--green)}
  .tabbar button.on .ic{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(0,225,122,.5))}
  .tabbar .nub{
    position:absolute;top:5px;right:calc(50% - 17px);
    min-width:7px;height:7px;border-radius:99px;background:var(--green);
  }
  .tabbar .nub.count{
    height:15px;padding:0 4px;font-size:9.5px;color:#04120A;
    display:grid;place-items:center;font-weight:800;letter-spacing:0;
  }
}

@media(max-width:900px){
  .search,.msgwrap,.roles,.row2,.row3,.plans{grid-template-columns:1fr}
  .filters{position:static;max-height:none}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .hero{padding:42px 24px}.hero h1{font-size:36px}
  .grid[style*="1.4fr"]{grid-template-columns:1fr !important}
  .threads{max-height:none;border-right:none;border-bottom:1px solid var(--line)}
}

@media(max-width:760px){
  body{font-size:15.5px}
  .shell{padding:0 15px 96px}
  h1{font-size:27px;letter-spacing:-.03em}
  h2{font-size:19px}
  .pad{padding:18px}
  .hero{padding:36px 20px;border-radius:18px}
  .hero h1{font-size:30px}
  .hero .sub{font-size:15.5px}
  .hero .stats{gap:26px;margin-top:28px}
  .hero .stats b{font-size:22px}

  /* la nav du haut devient une barre titre : la navigation passe en bas */
  .topnav{padding:13px 0;margin-bottom:20px;gap:10px}
  .topnav nav{display:none}
  .topnav .right .pill{display:none}
  .topnav .right .btn{padding:8px 13px;font-size:12.5px}

  .proto-bar{padding:7px 13px;gap:8px;font-size:11.5px}
  .proto-bar .proto-tag{display:none}
  .proto-jump{width:100%;margin-left:0}
  .proto-jump span{display:none}
  .proto-jump select{flex:1;min-width:0}

  /* cibles tactiles */
  .btn{padding:12px 18px;min-height:44px}
  .btn.sm{padding:10px 15px;min-height:40px}
  .chip{padding:10px 14px;font-size:13.5px}
  .field{padding:12px 13px;font-size:16px} /* 16px = pas de zoom auto iOS */

  .head-cta{margin-left:0;width:100%}
  .head-cta .btn{width:100%}
  .statgrid{gap:10px}
  .stat b{font-size:21px}
  .stat span{letter-spacing:.08em;font-size:10.5px}
  .toast{bottom:150px;width:calc(100% - 34px);text-align:center}
  .demobar{bottom:65px;padding:8px 14px;gap:8px;font-size:11px;justify-content:center}
  .demobar span{display:none}
  .demobar .btn{
    background:transparent;color:var(--green);border:1px solid rgba(0,225,122,.35);
    box-shadow:none;min-height:36px;padding:8px 14px;font-size:13px;
  }
  .back-site{display:none}
  .shell{padding-bottom:150px}
  .gal{grid-template-columns:1fr 1fr}
  .bubbles{max-height:none;min-height:200px;padding:16px}
  .composer{position:sticky;bottom:0;background:var(--card);z-index:2}
  .bub{max-width:86%}
}

@media(max-width:420px){
  .hero h1{font-size:26px}
  .gal{grid-template-columns:1fr}
  .score{padding-left:11px}
}

function allowed(sc){
  if(DEV) return true;

/* ---- ScoutScore ---- */
function scoutScore(p){
  const perf = p.poste==="Gardien" ? (p.cleanSheets||0)*4 : (p.buts*3 + p.passes*2);
  const vol  = Math.min(p.matchs,30)*1.1;
  const age  = Math.max(0, 24-p.age)*1.6;
  const nbVid= POSTS.filter(x=>x.playerId===p.id).length;
  const media= Math.min(nbVid,3)*5 + (p.bio?4:0);
  const dispo= p.dispo==="Libre"?8 : p.dispo==="Fin de contrat"?5 : 0;
  return Math.max(35,Math.min(99,Math.round(40 + perf*0.35 + vol*0.35 + age + media*0.35 + dispo*0.6)));
}

const KEY="scoutup-proto-v3";
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({PLAYERS,POSTS,ANNONCES,S})); }catch(e){}
}
function restore(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return false;
    const d=JSON.parse(raw);
    if(!d||!d.S||!Array.isArray(d.PLAYERS)) return false;
    PLAYERS=d.PLAYERS; POSTS=d.POSTS; ANNONCES=d.ANNONCES; S=d.S;
    S.toast=null;
    return true;
  }catch(e){ return false; }
}
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function go(sc){
  if(!allowed(sc)){
    /* Tentative d'accès à un écran d'un autre rôle : on ramène
       l'utilisateur sur son propre espace, sans le bloquer sèchement. */
    const home = S.role==="agent" ? "agent-search" : S.role==="club" ? "club-dashboard"
               : S.role==="player" ? "player-dashboard" : "home";
    if(sc!==home){ toast("Cet espace est réservé à un autre type de compte."); }
    sc = home;
  }
  /* Filet de sécurité : un écran qui suppose un compte connecté renvoie
     vers son écran d'entrée si le compte n'existe pas encore. */
  if(sc.startsWith("club-")&&sc!=="club-login"&&!S.club) sc="club-login";
  if(sc.startsWith("agent-")&&sc!=="agent-login"&&!S.agent) sc="agent-login";

}

/* ---------------- filtrage ---------------- */
function filtered(){
  const f=S.filters;
  let out=PLAYERS.filter(p=>{
    if(f.q){const q=f.q.toLowerCase();
      if(!(p.n.toLowerCase().includes(q)||p.club.toLowerCase().includes(q)||p.ville.toLowerCase().includes(q))) return false;}
    if(f.postes.length&&!f.postes.includes(p.poste)) return false;
    if(f.niveaux.length&&!f.niveaux.includes(p.niveau)) return false;
    if(f.pays.length&&!f.pays.includes(p.pays)) return false;
    if(f.dispo.length&&!f.dispo.includes(p.dispo)) return false;
    if(p.age>f.ageMax) return false;
    if(f.videoOnly&&postsOf(p.id).length===0) return false;
    return true;
  });
  const s=f.sort;
  out.sort((a,b)=> s==="score"?b.score-a.score : s==="age"?a.age-b.age : s==="buts"?b.buts-a.buts
    : s==="videos"?postsOf(b.id).length-postsOf(a.id).length : b.matchs-a.matchs);
  return out;
}

    ["annonces","◎","Annonces"],

function vSignup(){

  const steps=`<div class="steps">${[1,2,3].map(i=>`<div class="${i<=st?"on":""}"></div>`).join("")}</div>`;
  let body="";
  if(st===1){
    body=`<h2>Qui êtes-vous ?</h2><p class="sub">Ces informations apparaîtront en tête de votre profil.</p>
      <div class="mt-l"><label class="label">Nom et prénom</label><input class="field" data-f="n" value="${esc(m.n)}" placeholder="Ex. Yanis Belhadj"></div>
      <div class="row3 mt">
        <div><label class="label">Âge</label><input class="field" type="number" data-f="age" value="${m.age}" placeholder="19"></div>
        <div><label class="label">Taille (cm)</label><input class="field" type="number" data-f="taille" value="${m.taille}" placeholder="178"></div>
        <div><label class="label">Pied fort</label><select class="field" data-f="pied">${["Droit","Gauche","Ambidextre"].map(o=>`<option ${m.pied===o?"selected":""}>${o}</option>`).join("")}</select></div>
      </div>
      <div class="row2 mt">
        <div><label class="label">Pays</label><select class="field" data-f="pays">${PAYS.map(o=>`<option ${m.pays===o?"selected":""}>${o}</option>`).join("")}</select></div>
        <div><label class="label">Ville</label><input class="field" data-f="ville" value="${esc(m.ville)}" placeholder="Créteil"></div>
      </div>`;
  } else if(st===2){
    body=`<h2>Votre saison</h2><p class="sub">Les agents et les clubs filtrent d'abord par poste, niveau et disponibilité.</p>
      <div class="row2 mt-l">
        <div><label class="label">Poste principal</label><select class="field" data-f="poste"><option value="">—</option>${POSTES.map(o=>`<option ${m.poste===o?"selected":""}>${o}</option>`).join("")}</select></div>
        <div><label class="label">Niveau</label><select class="field" data-f="niveau"><option value="">—</option>${NIVEAUX.map(o=>`<option ${m.niveau===o?"selected":""}>${o}</option>`).join("")}</select></div>
      </div>
      <div class="mt"><label class="label">Club actuel</label><input class="field" data-f="club" value="${esc(m.club)}" placeholder="US Créteil-Lusitanos"></div>
      <div class="row3 mt">
        <div><label class="label">Matchs joués</label><input class="field" type="number" data-f="matchs" value="${m.matchs}" placeholder="24"></div>
        <div><label class="label">Buts</label><input class="field" type="number" data-f="buts" value="${m.buts}" placeholder="11"></div>
        <div><label class="label">Passes déc.</label><input class="field" type="number" data-f="passes" value="${m.passes}" placeholder="7"></div>
      </div>
      <div class="mt"><label class="label">Situation contractuelle</label>
        <div class="chips">${["Libre","Fin de contrat","Sous contrat"].map(o=>`<button class="chip ${m.dispo===o?"on":""}" data-a="dispo" data-v="${o}">${o}</button>`).join("")}</div></div>
      <div class="banner warn mt-l">ℹ️ <div>Les stats déclarées restent marquées « non vérifiées » tant qu'un club ou une ligue ne les a pas confirmées.</div></div>`;
  } else {
    body=`<h2>Présentation</h2><p class="sub">Vous pourrez publier vos vidéos juste après, depuis votre espace.</p>
      <div class="mt-l"><label class="label">Décrivez votre jeu</label>
        <textarea class="field" rows="5" data-f="bio" placeholder="Style de jeu, points forts, parcours de formation, objectifs pour la saison prochaine.">${esc(m.bio)}</textarea></div>
      <div class="banner mt-l">✅ <div>Votre profil ne sera visible que par les agents dont la licence FIFA est vérifiée et par les clubs affiliés.</div></div>`;
  }
  const ok = st===1?(m.n&&m.age) : st===2?(m.poste&&m.niveau) : true;
  return `<div class="shell">${topnav()}
    <div style="max-width:640px;margin:0 auto">${steps}
      <div class="card pad">${body}<div class="sep"></div>
        <div style="display:flex;gap:10px">
          <button class="btn ghost" data-a="${st>1?"step":"go"}" data-v="${st>1?"-1":"home"}">Retour</button>
          <div style="flex:1"></div>
          <button class="btn accent" data-a="${st<3?"step":"finish"}" data-v="1" ${ok?"":"disabled"}>${st<3?"Continuer":"Publier mon profil"}</button>
        </div></div>
      <p class="note mt">Étape ${st} sur 3</p></div></div>`;
}

  const unread=myUnread();
  const rang=PLAYERS.filter(p=>p.poste===me.poste).sort((a,b)=>b.score-a.score).findIndex(p=>p.id===me.id)+1;

      <div class="card pad">
        <h3>Complétion du profil</h3>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <p class="small mt-s">${pct}% complété</p>
        ${!mine.length?`<div class="banner warn mt">⚠️ <div><b>Publiez au moins une vidéo.</b> C'est le premier réflexe d'un agent qui ouvre un profil — et ça compte dans votre ScoutScore.</div></div>`:""}

        <div class="mt"><button class="btn ghost sm" data-a="go" data-v="player-profile">Voir mon profil public</button></div>
      </div>

          <h3>Messages ${unread?`<span class="pill green">${unread} non lu${unread>1?"s":""}</span>`:""}</h3>

/* ---------------- publications ---------------- */
/* Chaque vignette prend une teinte dérivée du joueur, pour que le fil
   ne ressemble pas à un seul bloc vert répété. */
function thumb(p,cls){
  const a=player(p.playerId);
  const c=a?colorFor(a.n):"#046B3B";
  const ang=100+([...p.id].reduce((s,x)=>s+x.charCodeAt(0),0)%80);
  const bg=`linear-gradient(${ang}deg,#07090A 0%,#0B1A14 52%,${c} 190%)`;
  return `<div class="thumb ${cls}" style="background:${bg}" data-a="playvid" data-v="${p.id}">
    <span class="kind">${p.type}</span><div class="play">▶</div><span class="dur">${p.dur}</span></div>`;
}

function postCard(p,showAuthor=true){
  const a=player(p.playerId);
  return `<div class="card post">
    ${showAuthor&&a?`<div class="head">${av(a.n,"sm")}
      <div style="flex:1;min-width:0">
        <div style="font-weight:660;font-size:14.5px">${esc(a.n)}${a.isMe?` <span class="pill green">vous</span>`:""}</div>
        <div class="small">${a.poste} · ${a.niveau} · ${esc(a.club)}, ${a.pays}</div>
      </div>
      <button class="btn ghost sm" data-a="openplayer" data-v="${a.id}">Voir le profil</button></div>`:""}
    ${thumb(p,"")}
    <div class="body">
      <div style="font-weight:650">${esc(p.titre)}</div>
      <p class="small mt-s" style="color:var(--ink-2)">${esc(p.desc)}</p>
      <div class="small mt-s">${ago(p.jours)}</div>
    </div>
    <div class="actions">
      <button class="${p.liked?"liked":""}" data-a="like" data-v="${p.id}">${p.liked?"♥":"♡"} ${p.likes}</button>
      <span>👁 ${p.vues} vues</span>
      ${S.role==="agent"&&a?`<button style="margin-left:auto" data-a="openplayer" data-v="${a.id}">Analyser le profil →</button>`:""}
    </div></div>`;
}

/* ---------------- messagerie ---------------- */
function vMessages(role){
  const isPro = role!=="player";
  const th=threadsFor(role);
  const open=th.find(t=>t.id===S.openThread)||th[0];
  if(open){ if(isPro) open.unreadParty=false; else open.unreadPlayer=false; }

  /* Zone de saisie : dépend du statut de la demande et de qui regarde. */
  let footer="";
  if(open){
    const envoyes=playerMsgCount(open);
    const bloque = open.status==="pending" && !isPro && open.initiator==="player" && envoyes>=MAX_PENDING;
    if(open.status==="pending" && isPro){
      footer=`<div class="composer" style="flex-direction:column;align-items:stretch;gap:10px">
        <div class="banner warn">⏳ <div><b>Demande de contact en attente.</b> ${esc(player(open.playerId)?.n||"Ce joueur")} vous a écrit ${envoyes} message${envoyes>1?"s":""}. Tant que vous n'acceptez pas, il ne peut pas en envoyer davantage.</div></div>
        <div style="display:flex;gap:10px">
          <button class="btn accent" data-a="accept" data-v="${open.id}">Accepter la demande</button>
          <button class="btn ghost" data-a="refuse" data-v="${open.id}">Refuser</button>
        </div></div>`;
    } else if(bloque){
      footer=`<div class="composer" style="flex-direction:column;align-items:stretch;gap:8px">
        <div class="banner warn">✋ <div><b>Limite de ${MAX_PENDING} messages atteinte.</b> ${esc(partyName(open))} doit accepter votre demande pour que la conversation continue. Vous serez notifié dès que c'est le cas.</div></div></div>`;
    } else {
      const reste = open.status==="pending"&&!isPro ? MAX_PENDING-envoyes : null;
      footer=`<div class="composer" style="flex-direction:column;align-items:stretch;gap:8px">
        ${reste!==null?`<p class="small" style="margin:0">Demande en attente d'acceptation — il vous reste ${reste} message${reste>1?"s":""}.</p>`:""}
        <div style="display:flex;gap:10px">
          <input class="field" data-f="draft" value="${esc(S.draft)}" placeholder="Écrire un message…">
          <button class="btn accent" data-a="send" data-v="${open.id}">Envoyer</button>
        </div></div>`;
    }
  }

  const intro = role==="agent" ? "Vos échanges avec les joueurs, et les demandes de contact à valider."
    : role==="club" ? "Les candidatures et les messages reçus. Vous acceptez ou refusez chaque demande."
    : "Vos échanges avec les agents et les clubs.";

  return `<div class="shell">${topnav()}
    <h1>Messages</h1><p class="sub">${intro}</p>
    ${isPro&&proPending(role)?`<div class="banner warn mt">📥 <div><b>${proPending(role)} demande${proPending(role)>1?"s":""} en attente.</b> Un joueur peut vous envoyer ${MAX_PENDING} messages au maximum avant que vous acceptiez.</div></div>`:""}
    <div class="card msgwrap mt-l">
      <div class="threads">
        ${th.length?th.map(t=>{
          const pl=player(t.playerId);
          const who=isPro?(pl?pl.n:"Joueur"):partyName(t);
          const sub=isPro?(pl?`${pl.poste} · ${pl.club}`:"Joueur")
            :(t.partyType==="agent"?(partyOf(t)?.cab||"Agent licencié"):"Club");
          const dot=isPro?t.unreadParty:t.unreadPlayer;
          return `<div class="thread ${open&&t.id===open.id?"on":""}" data-a="thread" data-v="${t.id}">${av(who,"sm")}
            <div style="min-width:0;flex:1">
              <div style="font-weight:640;font-size:14px;display:flex;gap:6px;align-items:center">${esc(who)}${dot?`<span style="width:7px;height:7px;border-radius:50%;background:var(--green)"></span>`:""}</div>
              <div class="small">${esc(sub)}${t.status==="pending"?` · <span style="color:var(--warn)">en attente</span>`:""}</div>
              <div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.msgs[t.msgs.length-1].t)}</div>
            </div></div>`;}).join(""):`<div class="empty small">Aucune conversation</div>`}
      </div>
      <div>${open?`
        <div class="bubbles">${open.msgs.map(m=>{
          const mine=isPro?m.from==="party":m.from==="player";
          return `<div class="bub ${mine?"me":""}">${esc(m.t)}</div>`;}).join("")}</div>
        ${footer}`
        :`<div class="empty">Aucune conversation ouverte.<br><span class="small">${isPro?"Contactez un joueur depuis la recherche pour démarrer un échange.":"Écrivez à un agent depuis l'annuaire ou postulez à une annonce."}</span></div>`}</div>
    </div></div>`;
}

            <div class="small">${esc(a.cab)} · ${a.pays}</div></div></div>
          <div class="chips mt"><span class="pill green">licence ${a.lic}</span><span class="pill">vérifié FIFA</span></div>
          <div class="mt"><button class="btn ${t?"ghost":"accent"} sm wide" data-a="${t?"gothread":"askagent"}" data-v="${t?t.id:a.id}">${lib}</button></div>
        </div>`;}).join("")}
    </div></div>`;
}

/* ---------------- rendu ---------------- */
function render(){
  let h="";
  switch(S.screen){
    case "home": h=vHome(); break;
    case "tarifs": h=vTarifs(); break;
    case "player-signup": h=vSignup(); break;
    case "player-dashboard": h=vPlayerDash(); break;
    case "player-publish": h=vPublish(); break;
    case "player-profile": h=vPlayerProfile(); break;
    case "feed": h=vFeed(); break;
    case "annonces": h=vAnnonces(); break;
    case "player-messages": h=vMessages("player"); break;
    case "player-agents": h=vAgents(); break;
    case "club-messages": h=vMessages("club"); break;
    case "agent-login": h=vAgentLogin(); break;
    case "agent-search": case "club-search": h=vSearch(); break;
    case "pro-player": h=vProPlayer(); break;
    case "agent-shortlist": h=vShortlist(); break;
    case "agent-messages": h=vMessages("agent"); break;
    case "club-login": h=vClubLogin(); break;
    case "club-dashboard": h=vClubDash(); break;
    case "club-annonce-new": h=vAnnNew(); break;
    default: h=vHome();
  }
  $("#app").innerHTML = h + demoBar() + tabbar() + (S.toast?`<div class="toast">${esc(S.toast)}</div>`:"");
  const jump=$("#jump");
  if(jump) jump.innerHTML = SCREENS.map(([k,l])=>`<option value="${k}" ${S.screen===k?"selected":""}>${l}</option>`).join("");
  save();
}

function refreshSignupNav(){
  if(S.screen!=="player-signup") return;
  const b=document.querySelector('[data-a="step"][data-v="1"], [data-a="finish"]');
  if(!b) return;
  const m=S.me, st=S.signupStep;
  b.disabled = !(st===1?(m.n&&m.age):st===2?(m.poste&&m.niveau):true);
}
function refreshBtn(sel,ok){ const b=document.querySelector(sel); if(b) b.disabled=!ok; }

/* ---------------- interactions ---------------- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;

  if(a==="go"){
    /* Un rôle ne se prend qu'au départ (ou en mode démo) : impossible de
       basculer vers un autre espace en cours de session. */
    const takeRole=r=>{ if(DEV||!S.role||S.role===r){ S.role=r; return true; } return false; };
    if(v==="player-dashboard"&&!S.myId) return go(takeRole("player")?"player-signup":v);
    if(v==="player-signup"&&!takeRole("player")) return go(v);
    if(v==="agent-login"&&!takeRole("agent")) return go(v);
    if(v==="club-login"&&!takeRole("club")) return go(v);
    /* Le logo ramène à l'espace du rôle en cours, pas au choix de rôle :
       revenir à l'accueil se fait explicitement par la déconnexion. */
    if(v==="home"){
      if(!DEV&&S.role) return go(S.role==="agent"?"agent-search":S.role==="club"?"club-dashboard":"player-dashboard");
      S.role=null;
    }
    if((v==="club-search"||v==="club-messages"||v==="club-dashboard")&&!S.club) return go("club-login");
    if((v==="agent-search"||v==="agent-messages"||v==="agent-shortlist")&&!S.agent) return go("agent-login");
    if((v==="player-agents"||v==="player-messages"||v==="annonces")&&!S.myId) return go("player-signup");
    return go(v);
  }
  if(a==="reset"){ wipe(); resetState(); toast("Prototype réinitialisé."); return render(); }

  if(a==="share"){
    const me=player(S.myId);
    const url=location.href.split("#")[0]+"#joueur-"+(me?me.id:"");
    const txt=me?`${me.n} — ${me.poste}, ${me.niveau}, ${me.club}. Profil ScoutUP :`:"Mon profil ScoutUP :";
    if(navigator.share){ navigator.share({title:"ScoutUP",text:txt,url}).catch(()=>{}); return; }
    if(navigator.clipboard){ navigator.clipboard.writeText(url+"").then(()=>toast("Lien du profil copié.")).catch(()=>toast("Lien : "+url)); return; }
    return toast("Lien : "+url);
  }
  if(a==="logout"){
    /* On change de casquette sans effacer les données : le profil créé,
       les vidéos publiées et les candidatures envoyées restent en place,
       ce qui permet de suivre une boucle joueur → club de bout en bout. */
    S.role=null; S.agent=null; S.club=null; S.licInput=""; S.clubCode="";
    S.openPlayer=null; S.openAnn=null; S.openThread=null;
    if(!DEV) toast("Déconnecté.");
    return go("home");
  }
  if(a==="step"){ S.signupStep=Math.min(3,Math.max(1,S.signupStep+(+v))); return render(); }
  if(a==="dispo"){ S.me.dispo=v; return render(); }

  if(a==="finish"){
    const m=S.me;
    const p={id:"me",n:m.n||"Nouveau joueur",age:+m.age||20,poste:m.poste||"Milieu central",pied:m.pied,
      taille:+m.taille||178,club:m.club||"Club non renseigné",niveau:m.niveau||"Régional 1",pays:m.pays,
      ville:m.ville||"—",matchs:+m.matchs||0,buts:+m.buts||0,passes:+m.passes||0,cleanSheets:0,
      dispo:m.dispo,bio:m.bio,isMe:true,vues:3};
    PLAYERS=PLAYERS.filter(x=>x.id!=="me").concat([p]);
    p.score=scoutScore(p);
    S.myId="me"; S.role="player"; S.signupStep=1;
    S.threads.filter(t=>t.playerId===null).forEach(t=>t.playerId="me");
    toast("Profil publié — pensez à ajouter une vidéo.");
    return go("player-dashboard");
  }

  if(a==="billing"){ S.billing=v; return render(); }
  if(a==="ptype"){ S.newPost.type=v; return render(); }
  if(a==="publish"){
    const n=S.newPost;
    const post={id:"po"+Date.now(),playerId:S.myId,type:n.type,titre:n.titre,desc:n.desc||"",
      dur:n.dur||"3:00",jours:0,likes:0,vues:0,liked:false};
    POSTS.unshift(post);
    const me=player(S.myId); me.score=scoutScore(me);
    S.newPost={type:"Compilation",titre:"",desc:"",dur:"",url:""};
    toast("Vidéo publiée — elle apparaît dans le fil.");
    return go("feed");
  }
  if(a==="like"){
    const p=POSTS.find(x=>x.id===v);
    p.liked=!p.liked; p.likes+=p.liked?1:-1; return render();
  }
  if(a==="playvid"){ return toast("Lecture vidéo — non implémentée dans le prototype."); }

  if(a==="verify"){
    const ag=AGENTS.find(x=>x.lic.toLowerCase()===S.licInput.trim().toLowerCase());
    if(!ag) return toast("Licence introuvable dans le registre FIFA.");
    S.agent=ag; S.role="agent"; toast("Licence vérifiée — bienvenue, "+ag.n+".");
    return go("agent-search");
  }
  if(a==="verifyclub"){
    const c=CLUBS.find(x=>x.code.toLowerCase()===S.clubCode.trim().toLowerCase());
    if(!c) return toast("Numéro d'affiliation introuvable.");
    S.club=c; S.role="club"; toast("Club vérifié — bienvenue, "+c.n+".");
    return go("club-dashboard");
  }

  if(a==="tf"){ const arr=S.filters[el.dataset.k]; const i=arr.indexOf(v); i>-1?arr.splice(i,1):arr.push(v); return render(); }
  if(a==="clearpays"){ S.filters.pays=[]; return render(); }
  if(a==="clearf"){ S.filters={q:"",postes:[],niveaux:[],pays:[],ageMax:26,dispo:[],videoOnly:false,sort:S.filters.sort}; return render(); }
  if(a==="openplayer"){
    S.openPlayer=v;
    /* Un pro qui ouvre la fiche du joueur connecté génère une visite visible
       côté joueur : c'est la boucle de valeur du produit. */
    const pro = S.role==="agent" ? S.agent : S.role==="club" ? S.club : null;
    if(pro && v===S.myId){
      const p=player(v); if(p) p.vues++;
      S.visits.unshift({nom:pro.n, type:S.role, quand:"à l'instant"});
      S.visits=S.visits.slice(0,8);
    }
    return go("pro-player");
  }
  if(a==="closeplayer"){ return go(S.role==="club"?"club-search":S.role==="agent"?"agent-search":"feed"); }
  if(a==="short"){ const i=S.shortlist.indexOf(v); i>-1?S.shortlist.splice(i,1):S.shortlist.push(v); return render(); }

  /* Le pro (agent ou club) initie : la conversation est ouverte d'emblée,
     sans quota et sans validation — c'est lui qui prend l'initiative. */
  if(a==="contact"){
    const p=player(v);
    if(S.contacted.includes(v)) return;
    S.contacted.push(v);
    const pro = S.role==="agent" ? S.agent : S.club;
    const txt = S.role==="agent"
      ? `Bonjour ${p.n.split(" ")[0]}, je suis ${pro.n} (${pro.cab}), agent licencié FIFA. Votre profil ScoutUP a retenu mon attention — seriez-vous disponible pour un échange cette semaine ?`
      : `Bonjour ${p.n.split(" ")[0]}, ${pro.n} (${pro.niveau}). Votre profil correspond à ce que nous cherchons pour la saison prochaine. Seriez-vous ouvert à un essai ?`;
    S.threads.unshift({id:"t"+Date.now(),playerId:v,partyType:S.role,partyId:pro.id,
      initiator:"party",status:"accepted",unreadPlayer:true,unreadParty:false,msgs:[{from:"party",t:txt}]});
    toast("Message envoyé à "+p.n);
    return render();
  }

  /* Le joueur initie : demande en attente, plafonnée à MAX_PENDING messages. */
  if(a==="askagent"){
    if(!S.myId) return toast("Créez d'abord votre profil.");
    const ag=AGENTS.find(x=>x.id===v);
    const me=player(S.myId);
    const t={id:"t"+Date.now(),playerId:S.myId,partyType:"agent",partyId:ag.id,initiator:"player",
      status:"pending",unreadPlayer:false,unreadParty:true,msgs:[
      {from:"player",t:`Bonjour, je suis ${me.n}, ${me.poste.toLowerCase()} en ${me.niveau} à ${me.club}. Je cherche un agent pour la saison prochaine, mes vidéos sont sur mon profil.`}]};
    S.threads.unshift(t); S.openThread=t.id;
    toast("Demande envoyée — 2 messages restants avant acceptation.");
    return go("player-messages");
  }
  if(a==="gothread"){ S.openThread=v; return go(S.role==="player"?"player-messages":S.role==="agent"?"agent-messages":"club-messages"); }

  if(a==="accept"){
    const t=S.threads.find(x=>x.id===v);
    t.status="accepted"; t.unreadPlayer=true;
    toast("Demande acceptée — la conversation est ouverte.");
    return render();
  }
  if(a==="refuse"){
    const t=S.threads.find(x=>x.id===v);
    S.threads=S.threads.filter(x=>x.id!==v);
    if(S.openThread===v) S.openThread=null;
    toast("Demande refusée — le joueur ne peut plus vous écrire.");
    return render();
  }

  if(a==="postuler"){
    const an=ANNONCES.find(x=>x.id===v);
    if(!S.myId) return toast("Créez d'abord votre profil.");
    if(an.cands.includes(S.myId)) return;
    an.cands.push(S.myId);
    const me=player(S.myId), c=club(an.clubId);
    S.threads.unshift({id:"t"+Date.now(),playerId:S.myId,partyType:"club",partyId:c.id,initiator:"player",
      status:"pending",unreadPlayer:false,unreadParty:true,msgs:[
      {from:"player",t:`Bonjour, je candidate à votre annonce « ${an.poste.toLowerCase()} ». Je suis ${me.n}, ${me.poste.toLowerCase()} en ${me.niveau} à ${me.club}. Mon profil complet et mes vidéos sont sur ScoutUP.`}]});
    toast("Candidature envoyée à "+c.n);
    return render();
  }
  if(a==="opencands"){ S.openAnn = S.openAnn===v?null:v; return render(); }
  if(a==="pubann"){
    const n=S.newAnn;
    ANNONCES.unshift({id:"an"+Date.now(),clubId:S.club.id,poste:n.poste,niveau:n.niveau,pays:S.club.pays,
      ville:n.ville||S.club.ville,desc:n.desc||"Pas de description.",jours:0,ageMax:+n.ageMax||23,cands:[]});
    S.newAnn={poste:"",niveau:"",ville:"",ageMax:23,desc:""};
    toast("Annonce publiée — les joueurs correspondants sont notifiés.");
    return go("club-dashboard");
  }

  if(a==="thread"){ S.openThread=v; return render(); }
  if(a==="send"){
    const t=S.threads.find(x=>x.id===v); if(!t||!S.draft.trim()) return;
    const isPro=S.role!=="player";
    if(!isPro && t.status==="pending" && playerMsgCount(t)>=MAX_PENDING)
      return toast(`Limite de ${MAX_PENDING} messages atteinte tant que la demande n'est pas acceptée.`);
    t.msgs.push({from:isPro?"party":"player",t:S.draft.trim()});
    S.draft=""; render();
    /* Réponse simulée uniquement si la conversation est acceptée */
    if(t.status==="accepted"){
      setTimeout(()=>{ t.msgs.push({from:isPro?"player":"party",
        t:isPro?"Merci pour votre message, je regarde ça et je reviens vers vous rapidement."
               :"Très bien, je vous propose un appel jeudi en fin de journée."}); render(); },900);
    }
    return;
  }
});

document.addEventListener("input", e=>{
  const f=e.target.dataset.f; if(!f) return;
  const val=e.target.value;
  if(f==="lic"){ S.licInput=val; return; }
  if(f==="clubcode"){ S.clubCode=val; return; }
  if(f==="draft"){ S.draft=val; return; }
  if(f==="q"){ S.filters.q=val; const p=e.target.selectionStart; render();
    const n=document.querySelector('[data-f="q"]'); if(n){n.focus();n.setSelectionRange(p,p);} return; }
  if(f==="ageMax"){ S.filters.ageMax=+val; return render(); }
  if(f==="videoOnly"){ S.filters.videoOnly=e.target.checked; return render(); }
  if(f.startsWith("p_")){ S.newPost[f.slice(2)]=val; return refreshBtn('[data-a="publish"]', !!S.newPost.titre); }
  if(f.startsWith("a_")){
    const k=f.slice(2); S.newAnn[k==="age"?"ageMax":k]=val;
    return refreshBtn('[data-a="pubann"]', !!(S.newAnn.poste&&S.newAnn.niveau));
  }
  S.me[f]=val; refreshSignupNav();
});

document.addEventListener("change", e=>{
  const f=e.target.dataset.f; if(!f) return;
  const val=e.target.value;
  if(f==="sort"){ S.filters.sort=val; return render(); }
  if(f==="addpays"){ if(val&&!S.filters.pays.includes(val)) S.filters.pays.push(val); return render(); }
  if(f.startsWith("a_")){ const k=f.slice(2); S.newAnn[k==="age"?"ageMax":k]=val;
    return refreshBtn('[data-a="pubann"]', !!(S.newAnn.poste&&S.newAnn.niveau)); }
  if(["pied","pays","poste","niveau"].includes(f)){ S.me[f]=val; refreshSignupNav(); }
});

if($("#jump")) $("#jump").addEventListener("change", e=>{
  const v=e.target.value;
  if(v.startsWith("player-")||v==="annonces"||(v==="feed"&&!S.agent&&!S.club)){
    if(!S.myId&&v!=="player-signup"){
      const d=seed[0];
      PLAYERS=PLAYERS.filter(x=>x.id!=="me").concat([{id:"me",cleanSheets:0,...d,isMe:true,vues:87,score:0}]);
      POSTS.filter(p=>p.playerId==="p0").forEach(p=>p.playerId="me");
      const me=player("me"); me.score=scoutScore(me);
      S.me={...d}; S.myId="me"; S.threads.filter(t=>t.playerId===null).forEach(t=>t.playerId="me");
    }
    S.role="player";
  }
  if(v.startsWith("agent-")&&!S.agent){ S.agent=AGENTS[0]; }
  if(v.startsWith("agent-")) S.role="agent";
  if(v.startsWith("club-")){ if(!S.club) S.club=CLUBS[0]; S.role="club"; }
  if(v==="home"||v==="tarifs") { /* rôle conservé */ }
  go(v);
});

render();
</script>
</body>
</html>
